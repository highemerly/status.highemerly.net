name: Debug OIDC

# OIDC の信頼ポリシーが合わないときの切り分け用。
# GitHub が発行するトークンの「主張（クレーム）」を実際に表示する。
# 原因が分かったら削除してよい。
#
# 生のトークンは出力しない。トークン自体は AWS の認証情報と交換できるため。
# 表示するのはペイロードのクレームのみで、これは秘密情報ではない。
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          echo "$TOKEN" | cut -d. -f2 | python3 -c '
          import sys, base64, json
          raw = sys.stdin.read().strip()
          raw += "=" * (-len(raw) % 4)
          claims = json.loads(base64.urlsafe_b64decode(raw))
          keys = ["sub", "aud", "iss", "repository", "repository_owner",
                  "ref", "event_name", "job_workflow_ref"]
          for k in keys:
              print(f"{k:20} {claims.get(k)!r}")
          '

          echo ""
          echo "信頼ポリシーの sub は上の sub と完全一致している必要がある"
